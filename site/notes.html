<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notes - centresystems.info</title>
<script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

<header>
  <a class="site" href="index.html">centresystems</a>
  <nav>
    <a href="index.html">home</a>
    <a href="projects.html">projects</a>
    <a class="cur" href="notes.html">notes</a>
    <button id="theme" type="button">dark</button>
  </nav>
</header>

<main id="main"><p class="msg">loading...</p></main>

</div>
<script src="assets/marked.js"></script>
<script src="assets/purify.js"></script>
<script src="assets/site.js"></script>
<script>
// Notes are plain .md files in /notes/. Drop a file there and it shows up.
// The list comes from Caddy's directory listing (file_server browse, as JSON).
(function () {
  var main = document.getElementById('main');
  var slug = new URLSearchParams(location.search).get('n');
  var SLUG_RE = /^[A-Za-z0-9._-]+$/;

  function fail(text) { main.replaceChildren(el('p', { class: 'msg' }, text)); }
  function title(name) { return name.replace(/\.md$/i, '').replace(/[-_]+/g, ' '); }

  function showList() {
    fetch('notes/', { headers: { Accept: 'application/json' }, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (items) {
        items = items
          .filter(function (i) { return !i.is_dir && /\.md$/i.test(i.name); })
          .sort(function (a, b) { return new Date(b.mod_time) - new Date(a.mod_time); });
        var frag = document.createDocumentFragment();
        frag.appendChild(el('h2', { class: 'label' }, 'Notes'));
        if (!items.length) {
          frag.appendChild(el('p', { class: 'msg' }, 'No notes yet.'));
        } else {
          var ul = el('ul', { class: 'list' });
          items.forEach(function (i) {
            var li = el('li');
            li.appendChild(el('span', { class: 'd' }, shortDate(i.mod_time)));
            li.appendChild(el('a', { href: 'notes.html?n=' + encodeURIComponent(i.name.replace(/\.md$/i, '')) }, title(i.name)));
            ul.appendChild(li);
          });
          frag.appendChild(ul);
        }
        main.replaceChildren(frag);
      })
      .catch(function () { fail('Could not load notes.'); });
  }

  function showNote(s) {
    fetch('notes/' + encodeURIComponent(s) + '.md', { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 404) throw new Error('missing');
        if (!r.ok) throw 0;
        return Promise.all([r.text(), r.headers.get('Last-Modified')]);
      })
      .then(function (res) {
        var article = el('article', { class: 'md' });
        renderMarkdown(article, res[0], function (u, kind) {
          if (u.charAt(0) === '/') return u;                   // site-absolute, leave it
          u = u.replace(/^\.\//, '');
          if (kind === 'link' && /\.md(#.*)?$/i.test(u)) {     // link to another note
            var parts = u.split('#');
            return 'notes.html?n=' + encodeURIComponent(parts[0].replace(/\.md$/i, '')) + (parts[1] ? '#' + parts[1] : '');
          }
          return 'notes/' + u;                                 // images etc. next to the .md
        });
        var h1 = article.querySelector('h1');
        if (!h1) { h1 = el('h1', {}, title(s)); article.prepend(h1); }
        document.title = h1.textContent + ' - centresystems.info';
        if (res[1]) h1.after(el('p', { class: 'pagemeta' }, shortDate(res[1])));

        var frag = document.createDocumentFragment();
        frag.appendChild(el('a', { class: 'back', href: 'notes.html' }, '← notes'));
        frag.appendChild(article);
        main.replaceChildren(frag);
      })
      .catch(function (e) { fail(e && e.message === 'missing' ? 'No note called "' + s + '".' : 'Could not load this note.'); });
  }

  if (slug && SLUG_RE.test(slug)) showNote(slug); else showList();
})();
</script>
</body>
</html>
