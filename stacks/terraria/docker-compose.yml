services:
  terraria:
    build: .
    container_name: terraria
    ports:
      - "7778:7777/tcp"
    volumes:
      - ./data:/data
    environment:
      TMOD_AUTODOWNLOAD: "2824688072,2824688266,2619954303,2669644269,2908170107,2563309347,2831752947,2565639705,2942702352,2669670918,2779956977,2599842771,2563528791"
      TMOD_ENABLEDMODS: "2824688072,2824688266,2619954303,2669644269,2908170107,2563309347,2831752947,2565639705,2942702352,2669670918,2779956977,2599842771,2563528791"
      TMOD_WORLDNAME: "main"
      TMOD_WORLDSIZE: "3"
      TMOD_DIFFICULTY: "0"
      TMOD_MAXPLAYERS: "8"
      TMOD_SECURE: "0"
      TMOD_PASS: "N/A"
      TMOD_AUTOSAVE_INTERVAL: "10"
    restart: unless-stopped
    stop_grace_period: 30s
