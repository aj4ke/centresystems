---
ansible_user: ansible
ansible_ssh_private_key_file: ~/.ssh/ansible_ed25519
ansible_become: true

vm_base_timezone: America/New_York
vm_base_domain: "{{ lab_domain }}"

accounts_automation_keys:
  - "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/ansible_ed25519.pub') }}"
accounts_users:
  - name: ajacobso
    ssh_keys: "{{ vault_ajacobso_ssh_keys }}"
