---
openwrt_dhcp:
  - type: dnsmasq
    options:
      domainneeded: '1'
      boguspriv: '1'
      filterwin2k: '0'
      localise_queries: '1'
      rebind_protection: '1'
      rebind_localhost: '1'
      local: /centresystems.internal/
      domain: centresystems.internal
      expandhosts: '1'
      nonegcache: '0'
      cachesize: '1000'
      authoritative: '1'
      readethers: '1'
      leasefile: /tmp/dhcp.leases
      resolvfile: /tmp/resolv.conf.d/resolv.conf.auto
      nonwildcard: '1'
      localservice: '1'
      ednspacket_max: '1232'
      filter_aaaa: '0'
      filter_a: '0'
  - type: dhcp
    name: lan
    options:
      interface: lan
      start: '100'
      limit: '100'
      leasetime: 12h
      dhcpv4: server
      dhcpv6: disabled
      ra: disabled
      ra_slaac: '1'
      ra_flags:
        - managed-config
        - other-config
      ignore: '1'
  - type: dhcp
    name: wan
    options:
      interface: wan
      ignore: '1'
      dhcpv6: disabled
      ra: disabled
  - type: odhcpd
    name: odhcpd
    options:
      maindhcp: '0'
      leasefile: /tmp/odhcpd.leases
      leasetrigger: /usr/sbin/odhcpd-update
      loglevel: '4'
      piodir: /tmp/odhcpd-piodir
      hostsdir: /tmp/hosts
  - type: dhcp
    name: services
    options:
      interface: services
      start: '100'
      limit: '100'
      leasetime: 12h
      ignore: '1'
      dhcpv6: disabled
      ra: disabled
  - type: dhcp
    name: public
    options:
      interface: public
      start: '100'
      limit: '100'
      leasetime: 12h
      ignore: '1'
      dhcpv6: disabled
      ra: disabled
  - type: dhcp
    name: lab
    options:
      interface: lab
      start: '100'
      limit: '100'
      leasetime: 12h
      ignore: '1'
      dhcpv6: disabled
      ra: disabled
