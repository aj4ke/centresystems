---
ansible_host: 192.168.30.40

compose_stack_name: terraria
compose_stack_dir: /root/terraria
compose_stack_files:
  - path: docker-compose.yml
  - path: Dockerfile

accounts_sudo_rules:
  zabbix-conntrack: "zabbix ALL=(root) NOPASSWD: /usr/sbin/conntrack -L -p tcp --dport 7778 --state ESTABLISHED"

zabbix_agent_extra_packages:
  - conntrack
zabbix_agent_user_parameters:
  - key: game.players
    command: /etc/zabbix/scripts/game_players.py conntrack 7778
