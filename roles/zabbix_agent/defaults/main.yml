---
zabbix_agent_package: zabbix-agent
zabbix_agent_version: "1:7.4*"
zabbix_agent_release_deb: https://repo.zabbix.com/zabbix/7.4/release/debian/pool/main/z/zabbix-release/zabbix-release_7.4-4+debian13_all.deb
zabbix_agent_config: /etc/zabbix/{{ 'zabbix_agent2.conf' if zabbix_agent_package == 'zabbix-agent2' else 'zabbix_agentd.conf' }}
zabbix_agent_include_dir: /etc/zabbix/{{ 'zabbix_agent2.d' if zabbix_agent_package == 'zabbix-agent2' else 'zabbix_agentd.d' }}
zabbix_agent_scripts_dir: /etc/zabbix/scripts
zabbix_agent_server: ""
zabbix_agent_host_metadata: ""
zabbix_agent_hostname: ""
zabbix_agent_extra_packages: []
zabbix_agent_scripts: []
zabbix_agent_user_parameters: []
