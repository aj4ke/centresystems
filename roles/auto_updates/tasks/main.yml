---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable daily security updates
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"

- name: Configure reboot policy
  ansible.builtin.copy:
    content: |
      Unattended-Upgrade::Automatic-Reboot "{{ auto_updates_reboot | lower }}";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ auto_updates_reboot_time }}";
      {% if auto_updates_extra_origins %}
      Unattended-Upgrade::Origins-Pattern {
      {% for origin in auto_updates_extra_origins %}
              "{{ origin }}";
      {% endfor %}
      };
      {% endif %}
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"
