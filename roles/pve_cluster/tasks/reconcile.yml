---
- name: Read {{ pve_cluster_api_label }}
  ansible.builtin.command: pvesh get {{ pve_cluster_api_path }} --output-format json
  register: pve_cluster_api_current
  changed_when: false
  check_mode: false

- name: Compare with inventory for {{ pve_cluster_api_label }}
  ansible.builtin.set_fact:
    pve_cluster_api_drift: "{{ pve_cluster_api_current.stdout | from_json | pve_config_drift(pve_cluster_api_config) }}"

- name: Report drift on {{ pve_cluster_api_label }}
  ansible.builtin.debug:
    msg: pvesh set {{ pve_cluster_api_path }} {{ pve_cluster_api_drift | join(' ') }}
  when: ansible_check_mode and pve_cluster_api_drift | length > 0
  changed_when: true

- name: Set drifted values on {{ pve_cluster_api_label }}
  ansible.builtin.command:
    argv: "{{ ['pvesh', 'set', pve_cluster_api_path] + pve_cluster_api_drift }}"
  when: not ansible_check_mode and pve_cluster_api_drift | length > 0
  changed_when: true
