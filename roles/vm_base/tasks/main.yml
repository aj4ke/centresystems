---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  notify: Hostname changed

- name: Configure /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    mode: "0644"

- name: Set timezone
  community.general.timezone:
    name: "{{ vm_base_timezone }}"

- name: Configure DNS resolvers
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    mode: "0644"

- name: Configure network interfaces
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    mode: "0644"

- name: Configure Debian APT sources
  ansible.builtin.template:
    src: debian.sources.j2
    dest: /etc/apt/sources.list.d/debian.sources
    mode: "0644"

- name: Remove legacy APT sources.list
  ansible.builtin.file:
    path: /etc/apt/sources.list
    state: absent

- name: Mount extra filesystems
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.opts | default('defaults') }}"
    passno: "{{ item.passno | default('0') }}"
    state: mounted
  loop: "{{ vm_base_mounts }}"
  loop_control:
    label: "{{ item.path }}"
