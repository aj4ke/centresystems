name: ci-deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shell scripts
        run: shellcheck deploy.sh centre-apply

      - name: JavaScript syntax
        run: |
          node --check api/api.js
          node --check site/assets/site.js

      - name: Caddyfile
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.6 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, centre-web]
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        run: ./deploy.sh
